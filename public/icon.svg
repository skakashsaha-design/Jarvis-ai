<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="60%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#010308"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGlow)"/>

  <!-- Outer Tech Hexagon / Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0284c7" stroke-width="2" stroke-dasharray="12 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.8"/>
  
  <!-- Dial ticks -->
  <g stroke="#38bdf8" stroke-width="3" opacity="0.6">
    <line x1="256" y1="52" x2="256" y2="70"/>
    <line x1="256" y1="442" x2="256" y2="460"/>
    <line x1="52" y1="256" x2="70" y2="256"/>
    <line x1="442" y1="256" x2="460" y2="256"/>
    <line x1="112" y1="112" x2="125" y2="125"/>
    <line x1="400" y1="400" x2="387" y2="387"/>
    <line x1="400" y1="112" x2="387" y2="125"/>
    <line x1="112" y1="400" x2="125" y2="387"/>
  </g>

  <!-- Arc Reactor Spokes -->
  <g stroke="url(#ringGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)">
    <circle cx="256" cy="256" r="140" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-dasharray="60 14"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke="#38bdf8" stroke-width="3"/>
  </g>

  <!-- Inner Core Reactor -->
  <circle cx="256" cy="256" r="70" fill="url(#coreGlow)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="50" fill="#ffffff" opacity="0.9"/>

  <!-- Holographic Center Crest -->
  <polygon points="256,220 286,275 226,275" fill="#0284c7" opacity="0.4"/>
  <text x="256" y="264" font-family="'Chakra Petch', 'Arial Black', sans-serif" font-weight="900" font-size="26" text-anchor="middle" fill="#0369a1" letter-spacing="1">J</text>

  <!-- Corner HUD brackets -->
  <path d="M 60,110 L 60,60 L 110,60" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.6"/>
  <path d="M 452,110 L 452,60 L 402,60" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.6"/>
  <path d="M 60,402 L 60,452 L 110,452" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.6"/>
  <path d="M 452,402 L 452,452 L 402,452" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.6"/>

  <!-- JARVIS M.V. Label -->
  <text x="256" y="475" font-family="'Chakra Petch', sans-serif" font-weight="700" font-size="20" text-anchor="middle" fill="#38bdf8" letter-spacing="4">JARVIS M.V.</text>
</svg>
